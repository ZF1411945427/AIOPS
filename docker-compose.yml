# ===== AIOps 一键编排 =====
# 用法: cp .env.example .env && docker compose up -d --build
# 携带可选监控栈(prometheus + grafana)对标 ongrid, 默认关闭(profile=monitoring)
# 启动: docker compose --profile monitoring up -d --build

name: aiops

services:
  aiops:
    build:
      context: .
      dockerfile: Dockerfile
    image: aiops:latest
    container_name: aiops
    ports:
      - "${AIOPS_PORT:-8000}:8000"
    depends_on:
      - postgres
    volumes:
      - ./logs:/app/logs            # 日志
      - ./license.lic:/app/license.lic:ro   # 许可证(可选)
    environment:
      - TZ=Asia/Shanghai
      - APP_ENV=${APP_ENV:-prod}
      # 生产默认直连 postgres 服务(SQLite 已解耦移除)
      - AIOPS_DB_URL=postgresql://${POSTGRES_USER:-aiops}:${POSTGRES_PASSWORD:-aiops-secret}@postgres:5432/${POSTGRES_DB:-aiops}
      - AIOPS_TEMPO_OTLP_URL=http://tempo:4318/v1/traces
      - AIOPS_TEMPO_QUERY_URL=http://tempo:3200
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3

  # ── 生产数据库 Postgres(默认核心服务, 项目已解耦 SQLite)──
  postgres:
    image: postgres:16-alpine
    container_name: aiops-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-aiops}
      - POSTGRES_USER=${POSTGRES_USER:-aiops}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-aiops-secret}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    restart: unless-stopped

  # ── 可选: Prometheus 抓取本系统 /metrics(profile=monitoring) ──
  prometheus:
    image: prom/prometheus:latest
    container_name: aiops-prometheus
    profiles: ["monitoring"]
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    ports:
      - "9090:9090"
    restart: unless-stopped

  # ── 可选: Grafana 可视化(profile=monitoring) ──
  grafana:
    image: grafana/grafana:latest
    container_name: aiops-grafana
    profiles: ["monitoring"]
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - prometheus

  # ── 可选: Loki 日志聚合(profile=monitoring) ──
  loki:
    image: grafana/loki:latest
    container_name: aiops-loki
    profiles: ["monitoring"]
    volumes:
      - ./deploy/loki/config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/config.yml
    restart: unless-stopped

  # ── 可选: Tempo 分布式追踪(profile=monitoring) ──
  tempo:
    image: grafana/tempo:latest
    container_name: aiops-tempo
    profiles: ["monitoring"]
    volumes:
      - ./deploy/tempo/config.yml:/etc/tempo/config.yml:ro
      - tempo-data:/tmp/tempo
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    command: -config.file=/etc/tempo/config.yml
    restart: unless-stopped

# ── 可选: HTTPS 反向代理 + Let's Encrypt 自动证书(profile=https)──
  # 启用: DOMAIN=ops.example.com docker compose --profile https up -d
  nginx:
    image: nginx:alpine
    container_name: aiops-nginx
    profiles: ["https"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf.tpl:/etc/nginx/nginx.conf.tpl:ro
      - ./deploy/nginx/docker-entrypoint.sh:/docker-entrypoint.sh:ro
      - certbot-www:/var/www/certbot
      - certbot-conf:/etc/letsencrypt
    environment:
      - DOMAIN=${DOMAIN:?DOMAIN 必填, 如 ops.example.com}
    command: /bin/sh /docker-entrypoint.sh
    depends_on:
      - aiops
    restart: unless-stopped

  # Let's Encrypt 证书签发 + 自动续签(每 12h 检测)
  certbot:
    image: certbot/certbot
    container_name: aiops-certbot
    profiles: ["https"]
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-conf:/etc/letsencrypt
    entrypoint: >
      sh -c "certbot certonly --webroot -w /var/www/certbot
      --email $${CERTBOT_EMAIL:-admin@${DOMAIN}}
      -d ${DOMAIN} --agree-tos --non-interactive
      && echo '证书申请成功, 定期续签中...'
      && trap exit TERM; while true; do
      certbot renew --quiet; sleep 12h & wait $${!}; done"
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
  tempo-data:
  postgres-data:
  certbot-www:
  certbot-conf:
