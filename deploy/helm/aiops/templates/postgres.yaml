{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aiops.postgres.fullname" . }}
  labels:
    {{- include "aiops.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgres
  selector:
    app: {{ include "aiops.postgres.fullname" . }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "aiops.postgres.fullname" . }}
  labels:
    {{- include "aiops.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "aiops.postgres.fullname" . }}
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "aiops.postgres.fullname" . }}
  template:
    metadata:
      labels:
        app: {{ include "aiops.postgres.fullname" . }}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.auth.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.auth.username | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "aiops.fullname" . }}-postgres
                  key: password
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.postgres.persistence.size }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aiops.fullname" . }}-postgres
  labels:
    {{- include "aiops.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ .Values.postgres.auth.password | quote }}
{{- end }}
