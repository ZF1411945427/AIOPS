{{- if and (not .Values.existingSecret) .Values.secret.LLM_API_KEY }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aiops.fullname" . }}
  labels:
    {{- include "aiops.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.secret.LLM_API_KEY }}
  LLM_API_KEY: {{ .Values.secret.LLM_API_KEY | quote }}
  {{- end }}
  {{- if .Values.secret.DB_PASSWORD }}
  DB_PASSWORD: {{ .Values.secret.DB_PASSWORD | quote }}
  {{- end }}
{{- end }}
