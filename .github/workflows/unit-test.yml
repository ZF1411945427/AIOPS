# ===== Backend Unit Test + Coverage =====
# push / PR 到 main 时运行
name: unit-test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: compile + pytest + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install app deps (CI 轻量子集)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Syntax check
        run: |
          python -m py_compile $(find app -name '*.py')
          python -m py_compile run.py

      - name: Run unit + integration tests with coverage gate
        run: |
          python -m pytest tests/ -q --cov=app --cov-fail-under=25 --cov-report=term-missing