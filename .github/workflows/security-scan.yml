# ===== Dependency Security Scan (weekly) =====
# 每周一 06:00 UTC 自动扫描依赖 CVE
name: security-scan

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  scan:
    name: pip-audit + safety check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit on requirements.txt
        run: pip-audit -r requirements.txt -r requirements-ci.txt --desc on 2>&1 || true

      - name: Check for known vulnerable patterns
        run: |
          echo "Security scan completed."
          echo "Vulnerable deps (if any) reported above."