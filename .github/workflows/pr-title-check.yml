# ===== PR 标题格式检查 =====
name: pr-title-check

on:
  pull_request:
    types: [opened, edited, synchronize]

jobs:
  title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PR title format
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "PR title: $TITLE"
          if echo "$TITLE" | grep -qiP '^(feat|fix|chore|docs|refactor|test|ci|perf|style)(\(.+\))?:'; then
            echo "PR title format: OK"
          else
            echo "::warning::PR title should follow conventional commits: feat/fix/chore/docs/refactor/test/ci/perf/style"
          fi