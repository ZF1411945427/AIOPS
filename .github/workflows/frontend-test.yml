# ===== Frontend Vitest =====
name: frontend-test

on:
  pull_request:
    branches: [main]

jobs:
  vitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install & test
        run: |
          npm ci --no-audit --no-fund --prefix frontend
          npx vitest run --prefix frontend