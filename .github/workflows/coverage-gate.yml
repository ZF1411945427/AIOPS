# ===== 覆盖率门禁 (≥25%) =====
name: coverage-gate

on:
  pull_request:
    branches: [main]

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install deps
        run: pip install -r requirements-ci.txt
      - name: Coverage gate
        run: python -m pytest tests/ -q --cov=app --cov-fail-under=25 --cov-report=term-missing