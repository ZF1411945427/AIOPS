# ===== Frontend Build + Test =====
# push / PR 到 main 时运行
name: frontend-build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: build + vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install & build
        run: |
          npm ci --no-audit --no-fund --prefix frontend
          NODE_OPTIONS=--max-old-space-size=2048 npm run build --prefix frontend

      - name: Run vitest
        run: |
          npm ci --no-audit --no-fund --prefix frontend 2>/dev/null || true
          npx vitest run --prefix frontend