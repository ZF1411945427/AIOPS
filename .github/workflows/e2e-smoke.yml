# ===== Backend E2E Smoke (real process) =====
# push 到 main 时运行（PR 可跳过以节省 CI 分钟数）
name: e2e-smoke

on:
  push:
    branches: [main]

jobs:
  e2e:
    name: E2E smoke against real backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CI deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Run E2E smoke
        run: python tests/e2e_smoke.py 8012