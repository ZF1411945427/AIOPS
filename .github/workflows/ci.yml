# ===== AIOps CI (H3 升级) =====
# 每次 push / PR 到 main 自动运行:
#   1) 后端 ruff 静态检查(真实 lint,抓未用导入/未定义名/重复定义/SQL None 比较等)
#   2) 后端 python 语法编译检查 + pytest 单元测试 + 覆盖率门禁
#   3) 前端 vite 构建
#   4) 根目录临时调试脚本守卫
# 对齐 ongrid .github/workflows/ci.yml 的工程纵深(ruff≈golangci-lint, 覆盖度≈go test -race)

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-lint:
    name: Backend ruff lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check (app + tests + tools + deploy + scripts)
        run: ruff check app tests tools deploy scripts

  backend-arch:
    name: Backend architecture check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run arch check
        run: python tools/arch_check.py

  backend-test:
    name: Backend compile + pytest + coverage
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install app deps (CI 轻量子集)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Syntax check (all app + key files)
        run: |
          python -m py_compile $(find app -name '*.py')
          python -m py_compile run.py

      - name: Run unit + integration tests with coverage gate
        run: |
          python -m pytest tests/ -q --cov=app --cov-fail-under=25 --cov-report=term-missing

  backend-e2e:
    name: Backend E2E smoke (real process)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CI deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Run E2E smoke against real backend
        run: python tests/e2e_smoke.py 8012

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install & build
        run: |
          npm ci --no-audit --no-fund --prefix frontend
          NODE_OPTIONS=--max-old-space-size=2048 npm run build --prefix frontend

  frontend-test:
    name: Frontend vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install & test
        run: |
          npm ci --no-audit --no-fund --prefix frontend
          npx vitest run --prefix frontend

  sanitize:
    name: Repo hygiene guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reject stray debug/check temp scripts in root
        run: |
          if ls check_*.py debug_*.py fix_*.py force_alert.py 2>/dev/null; then
            echo "::error::Found stray temp scripts in repo root (check_/debug_/fix_/force_alert). Please remove."
            exit 1
          fi
          echo "Root temp-script guard passed."
